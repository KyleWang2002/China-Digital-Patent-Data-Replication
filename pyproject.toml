[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patentrep"
version = "0.1.0"
description = "Chinese digital-technology patent text and geospatial data construction"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "beautifulsoup4>=4.11", "requests>=2.28"]

[project.optional-dependencies]
browser = ["selenium>=4.14"]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
